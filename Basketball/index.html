<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div class="column">
            <h3>HOME</h3>
            <div id="home-score"></div>
            <div class="button-group">
                <button onclick="addOneHome()">+1</button>
                <button onclick="addTwoHome()">+2</button>
                <button onclick="addThreeHome()">+3</button>
            </div>
        </div>
        <div class="column">
            <h3>AWAY</h3>
            <div id="guest-score"></div>
            <div class="button-group">
                <button onclick="addOneGuest()">+1</button>
                <button onclick="addTwoGuest()">+2</button>
                <button onclick="addThreeGuest()">+3</button>
            </div>
            
            <button onclick="resetBtn()">RESET</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
